[platformio]
default_envs = papers3-demo
src_dir = .

[env:papers3-demo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = examples/PaperS3BinFontDemo/partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_ram_size = 524288
board_upload.maximum_size = 16777216
upload_speed = 1500000
monitor_speed = 115200
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
build_flags =
  -Isrc
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
build_src_filter =
  -<*>
  +<src/BinFontLib.cpp>
  +<src/core/BinFontParser.cpp>
  +<src/core/BinFontRuntime.cpp>
  +<src/platform/M5FontRenderer.cpp>
  +<examples/PaperS3BinFontDemo/PaperS3BinFontDemo.cpp>
  +<examples/PaperS3BinFontDemo/PaperS3DemoApp.cpp>
lib_deps =
  m5stack/M5Unified
  m5stack/M5GFX


